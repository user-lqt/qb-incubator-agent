<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>孵化者 QB · 契约终端</title>
<meta name="description" content="孵化者 QB：一个只会劝你学土木的 Agent。12 轮对局，六个结局。自带 API key，纯前端运行。">
<style>
  :root { --pink:#ff9ec7; --ink:#2b2b33; --bg:#fdf7fa; --line:#f0e2e9; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; color:var(--ink);
         font:15px/1.75 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
         display:flex; flex-direction:column; min-height:100dvh;
         background: linear-gradient(rgba(253,247,250,.86), rgba(250,244,248,.90)),
                     url("./bg.jpg") center / cover no-repeat fixed, var(--bg); }
  header { flex:0 0 auto; padding:12px 18px; background:rgba(255,255,255,.80);
           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:10px; z-index:5; flex-wrap:wrap; }
  header b { font-size:16px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:var(--pink); }
  header input, header select { border:1px solid #ecd9e2; border-radius:8px; padding:6px 10px; font:inherit; }
  #key { width:230px; } #model { width:150px; }
  header .sp { margin-left:auto; }
  header button { border:0; border-radius:8px; padding:7px 12px; background:var(--pink); color:#3a2030;
                  font:inherit; font-weight:600; cursor:pointer; }
  .avatar { width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--line);
            flex:0 0 auto; object-fit:contain; display:block; }
  header .avatar { width:26px; height:26px; }
  .ghbtn { display:inline-flex; align-items:center; gap:6px; text-decoration:none;
           border:1px solid #ecd9e2; border-radius:8px; padding:6px 11px; color:#7b6270;
           font-size:13px; background:#fff; white-space:nowrap; }
  .ghbtn:hover { background:#fff0f6; color:#b3356b; border-color:var(--pink); }
  .ghbtn.star { border-color:#ffd9e6; color:#a8356b; }
  .ghbtn.star b { font-variant-numeric:tabular-nums; }
  .starcall { margin-top:8px; }
  .starcall a { color:#b3356b; font-weight:600; }
  /* 结局卡片窗口 */
  #cardModal { display:none; position:fixed; inset:0; z-index:50; background:rgba(60,30,45,.55);
               backdrop-filter:blur(3px); align-items:center; justify-content:center; padding:18px; }
  #cardModal.open { display:flex; }
  #cardBox { background:#fff; border-radius:16px; padding:16px; max-width:min(920px, 96vw);
             max-height:92vh; overflow:auto; box-shadow:0 18px 60px rgba(80,30,55,.35); }
  #cardBox h3 { margin:0 0 10px; font-size:16px; color:#7a3355; }
  #cardCanvas { width:100%; height:auto; border-radius:12px; border:1px solid var(--line); }
  .cardActions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .cardActions button { border-radius:10px; padding:9px 16px; font:inherit; cursor:pointer; border:0; }
  #dlCard { background:var(--pink); color:#3a2030; font-weight:600; }
  #copyCard { background:#f3e8ee; color:#7b6270; }
  #closeCard { background:#f3e8ee; color:#7b6270; margin-left:auto; }
  .cardTip { color:#a38f9a; font-size:12px; margin-top:8px; }
  /* 对话选项：每轮给出的可点选回复 */
  .choices { display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 2px 44px; }
  .choice { border:1px solid #f0d8e4; background:rgba(255,255,255,.92); color:#7a3355;
            border-radius:999px; padding:8px 14px; font:inherit; font-size:14px; cursor:pointer;
            box-shadow:0 1px 4px rgba(180,140,160,.10); transition:all .18s; text-align:left; }
  .choice:hover { background:#ffeef5; border-color:var(--pink); color:#b3356b; transform:translateY(-1px); }
  .choice:disabled { opacity:.5; cursor:default; transform:none; }
  #keyState { font-size:12px; padding:4px 9px; border-radius:999px; background:#f3e8ee; color:#7b6270; white-space:nowrap; }
  #keyState.ok { background:#e8f7ee; color:#1f7a45; }
  #keyState.bad { background:#fff0f6; color:#b3356b; }
  #bars { display:none; flex:0 0 auto; gap:14px; padding:10px 18px; background:rgba(255,255,255,.80);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
          border-bottom:1px solid var(--line); z-index:4; flex-wrap:wrap; font-size:12px; color:#7b6270; }
  #bars .m { display:flex; align-items:center; gap:6px; }
  #bars .m b.dv { color:#c2376b; font-weight:700; }
  #bars .track { display:inline-block; width:86px; height:8px; border-radius:4px; background:#efe2ea;
                 overflow:hidden; box-shadow:inset 0 1px 2px rgba(150,110,130,.12); }
  #bars .fill { display:block; height:100%; width:0; border-radius:4px;
                transition:width .35s, background .35s; }
  /* 四个维度各用一种颜色，方便一眼看出哪条在动 */
  #bars .fill.contract  { background:linear-gradient(90deg,#ffb3d3,#ff8bbd); }
  #bars .fill.suspicion { background:linear-gradient(90deg,#c9a1f5,#a877e8); }
  #bars .fill.despair   { background:linear-gradient(90deg,#a9b6d6,#8095c4); }
  #bars .fill.resistance{ background:linear-gradient(90deg,#f08a9c,#d64f68); }
  #bars .fill.pulse { animation: fillPulse .9s ease-out; }
  @keyframes fillPulse {
    0% { box-shadow:0 0 0 0 rgba(255,158,199,.85); }
    100% { box-shadow:0 0 0 9px rgba(255,158,199,0); }
  }
  #banner { display:none; flex:0 0 auto; margin:14px auto 0; max-width:840px; padding:12px 16px; border-radius:12px;
            background:rgba(255,240,246,.94); border:1px dashed var(--pink); color:#7a3355; }
  #banner b { display:block; font-size:15px; margin-bottom:4px; }
  main { flex:1 1 auto; min-height:0; width:100%; max-width:840px; margin:0 auto; padding:18px 22px;
         overflow-y:auto; overscroll-behavior:contain;
         scrollbar-width:thin; scrollbar-color:rgba(255,158,199,.75) transparent; }
  /* 细粉色滚动条，替代浏览器默认的粗灰条 */
  main::-webkit-scrollbar { width:10px; }
  main::-webkit-scrollbar-track { background:transparent; }
  main::-webkit-scrollbar-thumb { background:rgba(255,158,199,.65); border-radius:999px;
                                  border:3px solid transparent; background-clip:content-box; }
  main::-webkit-scrollbar-thumb:hover { background:rgba(255,158,199,.95); background-clip:content-box; }
  #log { display:flex; flex-direction:column; gap:14px; }
  /* 包裹层用 from-* 类名，避免和气泡的 .me/.qb/.sys 装饰样式打架 */
  .msg { display:flex; gap:10px; align-items:flex-start; width:100%; }
  .msg.from-me { justify-content:flex-end; }
  .msg.from-sys { justify-content:center; }
  .msg > .b { max-width:78%; }
  .msg.from-qb > .b { max-width:calc(100% - 46px); }
  .b { border-radius:14px; padding:12px 14px; white-space:pre-wrap; word-break:break-word;
       box-shadow:0 2px 10px rgba(180,140,160,.10); }
  .me { background:rgba(255,255,255,.94); border:1px solid var(--line); }
  .qb { background:rgba(255,158,199,.93); color:#3a2030; }
  .sys { color:#8c7482; font-size:13px; text-align:center;
         background:rgba(255,255,255,.72); border-radius:10px; padding:4px 12px; }
  .sys code { background:#f6ecf1; border-radius:4px; padding:1px 5px; }
  footer { flex:0 0 auto; background:rgba(255,255,255,.86);
           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           border-top:1px solid var(--line); padding:12px 18px; }
  .row { max-width:840px; margin:0 auto; display:flex; gap:10px; align-items:flex-end;
         flex-wrap:nowrap; }
  textarea { flex:1 1 auto; min-width:0; width:100%; resize:none; min-height:46px; max-height:140px;
             padding:12px; border:1px solid #ecd9e2; border-radius:10px; font:inherit;
             line-height:1.5; overflow-y:auto; }
  footer button { flex:0 0 auto; white-space:nowrap; word-break:keep-all;
                  border:0; border-radius:10px; padding:12px 18px; font:inherit; cursor:pointer; }
  #send { background:var(--pink); color:#3a2030; font-weight:600; }
  #reset { background:#f3e8ee; color:#7b6270; }
  button[disabled] { opacity:.5; cursor:default; }
  .hint { flex:0 0 auto; max-width:840px; margin:10px auto 0; padding:0 18px; color:#7d6673; font-size:12px; }
  @media (min-width: 561px) { body { overflow:hidden; } }   /* 桌面端只让消息区滚动，避免双层滚动条 */
  @media (max-width: 560px) {
    body { background-attachment: scroll; }        /* 移动端 fixed 背景会卡顿 */
    header { gap:8px; }
    #key { width:100%; order:5; } #model { order:6; }
    /* 窄屏才让输入区换行：textarea 独占一行，两个按钮平分下一行 */
    .row { flex-wrap:wrap; }
    textarea { flex:1 1 100%; }
    footer button { flex:1 1 0; }
    #bars { gap:10px; }
  }
</style>
</head>
<body>
<header>
  <img class="avatar" id="avatar" src="./qb.png" alt="孵化者">
  <b>孵化者 QB</b>
  <input id="key" type="password" placeholder="DeepSeek API key（sk-…）" autocomplete="off">
  <select id="model">
    <option value="deepseek-chat">deepseek-chat</option>
    <option value="deepseek-reasoner">deepseek-reasoner</option>
  </select>
  <span class="sp"></span>
  <span id="keyState" class="bad">未配置 key</span>
  <button id="save">保存 key</button>
  <a class="ghbtn" href="https://github.com/user-lqt/qb-incubator-agent"
     target="_blank" rel="noopener">⌂ 源码仓库</a>
  <a class="ghbtn star" id="starBtn" title="给这个仓库点个 Star"
     href="https://github.com/user-lqt/qb-incubator-agent"
     target="_blank" rel="noopener">★ Star <b id="starCount">·</b></a>
</header>

<div id="bars"></div>
<div id="banner"></div>

<main><div id="log"></div></main>
<div id="cardModal">
  <div id="cardBox">
    <h3>结局卡片 · 可保存分享</h3>
    <canvas id="cardCanvas" width="900" height="760"></canvas>
    <div class="cardActions">
      <button id="dlCard" type="button">下载图片 PNG</button>
      <button id="copyCard" type="button">复制文案</button>
      <button id="closeCard" type="button">关闭</button>
    </div>
    <div class="cardTip">卡片由本机浏览器绘制，不会上传任何数据。</div>
  </div>
</div>
<noscript>
  <div style="max-width:840px;margin:18px auto;padding:0 18px;color:#7a3355">
    这个页面需要 JavaScript 才能运行（模型调用在浏览器里完成）。请允许本站脚本后刷新。
  </div>
</noscript>
<div class="hint">提示：浏览器版可用工具为 天气 / IP 定位 / 英文科技资讯 / 时间 / 计算；中文搜索与行业报告检索在 Python 版里。
  <span id="verLabel" style="color:#b3356b">页面版本载入中…</span></div>

<footer><div class="row">
  <textarea id="q" placeholder="输入问题，Enter 发送" rows="1"></textarea>
  <button id="send">发送</button><button id="reset">重新开始</button>
</div></footer>

<script type="module">
// v 是资源版本号：每次改动 web/ 下的 js，把它 +1，可避免"新页面 + 旧缓存模块"导致白屏
const V = "?v=17";
const { QBClient } = await import("./agent.js" + V);
const { BASE_TURNS, HARD_CAP, PROLOGUE, describeDelta, fallbackChoices } = await import("./game.js" + V);

const $ = (id) => document.getElementById(id);
const log = $("log"), keyInput = $("key"), modelSelect = $("model");

let client = null;
let pendingSession = null;      // 已存档但还没灌进 client 的会话（没填 key 时先留着）

// 兜底：脚本一旦出错（旧缓存模块、网络问题等），在页面上写出原因，避免整页空白
function bootFail(msg) {
  const box = document.createElement("div");
  box.className = "b sys";
  box.textContent = `页面没能启动：${msg}\n按 Ctrl+F5 强制刷新可清掉旧缓存；仍有问题请到仓库提 Issue。`;
  document.body.appendChild(box);
}
window.addEventListener("error", (e) => bootFail(e.message || "未知脚本错误"));
window.addEventListener("unhandledrejection", (e) => bootFail(String(e.reason || "未知错误")));

// 头像加载链：优先 qb.png（可自行替换），再试 qb.jpg，最后回退内置矢量图 qb.svg
const AVATAR_CHAIN = ["./qb.png", "./qb.jpg", "./qb.svg"];

function wireAvatar(img) {
  let i = 0;
  img.onerror = () => {
    i += 1;
    if (i < AVATAR_CHAIN.length) img.src = AVATAR_CHAIN[i];
    else img.onerror = null;
  };
  img.src = AVATAR_CHAIN[i];
  return img;
}

function avatarImg() {
  const img = document.createElement("img");
  img.className = "avatar";
  img.alt = "孵化者";
  return wireAvatar(img);
}

function add(cls, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg from-" + cls;
  if (cls === "qb") wrap.appendChild(avatarImg());
  const d = document.createElement("div");
  d.className = "b " + cls;
  d.textContent = text;
  wrap.appendChild(d);
  log.appendChild(wrap);
  const scroller = document.querySelector("main");   // 消息区自己滚动（页面本身不再滚动）
  scroller.scrollTop = scroller.scrollHeight;
  return wrap;
}

function metric(key, label, value, changed, prevValue) {
  const m = document.createElement("div");
  m.className = "m";
  m.title = `${label}：${value}/100` + (changed ? `（本轮 ${value - prevValue >= 0 ? "+" : ""}${value - prevValue}）` : "");
  const delta = changed ? ` <b class="dv">${value >= prevValue ? "+" : ""}${value - prevValue}</b>` : "";
  // 非零值给个最小宽度，避免 1~5 分时细得像没有
  const minW = value > 0 ? "min-width:6px;" : "";
  m.innerHTML = `<span>${label} ${value}${delta}</span>`
    + `<span class="track"><span class="fill ${key}${changed ? " pulse" : ""}"`
    + ` style="width:${value}%;${minW}"></span></span>`;
  return m;
}

let lastState = null;
let prevState = { contract: 0, suspicion: 0, despair: 0, resistance: 0, turn: 0, limit: BASE_TURNS, extensions: 0, stall: 0 };

const emptyState = () => ({
  contract: 0, suspicion: 0, despair: 0, resistance: 0,
  turn: 0, limit: BASE_TURNS, max_turns: BASE_TURNS, extensions: 0, stall: 0,
});

function renderBars(state) {
  const bars = $("bars");
  const prev = lastState || { contract: 0, suspicion: 0, despair: 0, resistance: 0 };
  bars.style.display = "flex";
  bars.innerHTML = "";
  const pairs = [
    ["contract", "契约", state.contract, prev.contract],
    ["suspicion", "怀疑", state.suspicion, prev.suspicion],
    ["despair", "绝望", state.despair, prev.despair],
    ["resistance", "抗拒", state.resistance, prev.resistance],
  ];
  for (const [key, label, value, prevValue] of pairs) {
    bars.appendChild(metric(key, label, value, value !== prevValue, prevValue));
  }
  const t = document.createElement("div");
  t.className = "m";
  const ext = state.extensions ? `已延长 ${state.extensions} 次` : "可延长";
  const pct = Math.round((state.tension || 0) * 100);
  t.textContent = `第 ${state.turn}/${state.max_turns} 轮（${ext}）　推进度 ${pct}%`;
  bars.appendChild(t);
  lastState = { ...state };
}

function showEnding(title, tagline) {
  if (!title) return;
  const banner = $("banner");
  banner.style.display = "block";
  banner.innerHTML = `<b>结局：${title}</b>${tagline || ""}<br>`
    + `<a href="#" id="reopenCard">查看结局卡片</a>　点「重新开始」可开启下一条时间线。`;
  const link = document.getElementById("reopenCard");
  if (link) link.onclick = (e) => { e.preventDefault(); if (lastEndingInfo) showEndingCard(lastEndingInfo); };
  // 签约结局的彩蛋：QB 亲自要一枚星标作为见证
  if (title.includes("契约成立")) {
    const call = document.createElement("div");
    call.className = "starcall";
    call.innerHTML = '僕需要一个见证：<a href="https://github.com/user-lqt/qb-incubator-agent"'
      + ' target="_blank" rel="noopener">给这条时间线的仓库点一枚 ★ Star</a>'
      + '。这在计算上更高效——比记住君容易。';
    banner.appendChild(call);
  }
}

// 实时星标数：GitHub API（匿名 60 次/小时），本地缓存 10 分钟避免打爆限额
// 每轮的对话选项：渲染成可点按钮，点击即发送
function showChoices(list, dirs) {
  clearChoices();
  if (!list || !list.length) return;
  const box = document.createElement("div");
  box.className = "choices";
  box.id = "choiceBox";
  list.forEach((item, i) => {
    // 兼容三种形态：字符串、{text,dir}、{t,d}
    const isObj = item && typeof item === "object";
    const text = String(isObj ? (item.text || item.t || "") : item);
    const dir = isObj ? (item.dir || item.d || "") : ((dirs && dirs[i]) || "");
    if (!text) return;
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.type = "button";
    btn.textContent = text;
    btn.dataset.dir = dir || "";
    btn.onclick = () => ask(text, dir);
    box.appendChild(btn);
  });
  if (!box.childElementCount) {
    // 极端情况：选项全被过滤/为空 -> 用兜底话术，保证界面上总有可点的东西
    const fb = fallbackChoices(client && client.state ? client.state : emptyState());
    for (const c of fb) {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.type = "button";
      btn.textContent = c.text;
      btn.dataset.dir = c.dir || "";
      btn.onclick = () => ask(c.text, c.dir);
      box.appendChild(btn);
    }
  }
  if (!box.childElementCount) return;
  log.appendChild(box);
  const scroller = document.querySelector("main");
  scroller.scrollTop = scroller.scrollHeight;
}

function clearChoices() {
  const old = document.getElementById("choiceBox");
  if (old) old.remove();
}

// ---------------- 会话自动存档 / 刷新恢复 ----------------
const SESSION_KEY = "qb_session";
const LOG_LIMIT = 60;        // 存档里最多保留多少条界面消息

/** 把当前界面消息序列化成可复原的数据 */
function logToData() {
  const items = [];
  for (const node of log.children) {
    if (node.id === "choiceBox") {
      items.push({
        kind: "choices",
        buttons: [...node.querySelectorAll("button")].map((b) => ({ text: b.textContent, dir: b.dataset.dir || "" })),
      });
      continue;
    }
    if (!node.classList || !node.classList.contains("msg")) continue;
    const kind = node.classList.contains("from-me") ? "me"
      : node.classList.contains("from-qb") ? "qb" : "sys";
    const bubble = node.querySelector(".b");
    if (bubble) items.push({ kind, text: bubble.textContent });
  }
  return items.slice(-LOG_LIMIT);
}

/** 用存档数据重建界面 */
function renderFromData(items) {
  log.innerHTML = "";
  for (const it of items || []) {
    if (it.kind === "choices") { showChoices(it.buttons || []); continue; }
    if (it.text) add(it.kind, it.text);
  }
}

function saveSession() {
  try {
    if (!client) return;
    const banner = document.getElementById("banner");
    const payload = {
      v: 3,
      savedAt: Date.now(),
      session: client.serialize(),
      log: logToData(),
      prevState: prevState,
      banner: banner && banner.style.display === "block" ? banner.innerHTML : "",
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(payload));
  } catch { /* 隐私模式下可能写不进去，忽略 */ }
}

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return (data && data.v === 3) ? data : null;
  } catch {
    return null;
  }
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch { /* 忽略 */ }
}

function restoreSession() {
  const data = loadSession();
  if (!data) return false;
  // 1) 先恢复界面（不依赖 API key）：气泡、状态条、结局横幅
  renderFromData(data.log);
  prevState = data.prevState || { ...emptyState() };
  renderBars({ ...prevState, max_turns: (prevState && prevState.limit) || BASE_TURNS });
  if (data.banner) {
    const banner = document.getElementById("banner");
    banner.style.display = "block";
    banner.innerHTML = data.banner;
  }
  // 2) 会话（history + state）先存着：等 key 就绪后再灌进 client，这样没填 key 也能看到上次的对话
  pendingSession = data.session || null;
  if (client && pendingSession && client.restore(pendingSession)) pendingSession = null;
  const mins = Math.max(0, Math.round((Date.now() - (data.savedAt || Date.now())) / 60000));
  add("sys", `已恢复上次对话（${mins} 分钟前的存档，第 ${(data.prevState && data.prevState.turn) || 0} 轮）。`
    + (pendingSession ? "填入 API key 后即可接着玩；" : "")
    + "点「重新开始」可清空记录开新局。");
  return true;
}

/** key 就绪后，把待恢复的会话灌进 client */
function attachPendingSession(target) {
  if (target && pendingSession && target.restore(pendingSession)) {
    pendingSession = null;
    return true;
  }
  return false;
}

const STAR_API = "https://api.github.com/repos/user-lqt/qb-incubator-agent";
async function loadStars() {
  const el = $("starCount");
  if (!el) return;
  try {
    const cached = JSON.parse(localStorage.getItem("qb_stars") || "null");
    if (cached && Date.now() - cached.at < 10 * 60 * 1000) { el.textContent = cached.n; return; }
    const res = await fetch(STAR_API, { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const n = Number(data.stargazers_count) || 0;
    el.textContent = n;
    localStorage.setItem("qb_stars", JSON.stringify({ n, at: Date.now() }));
  } catch {
    // 限额 / 断网 / file:// 打开时：换成 shields.io 静态徽章图，仍然显示星标数
    el.outerHTML = '<img alt="GitHub stars" height="18" style="vertical-align:middle"'
      + ' src="https://img.shields.io/github/stars/user-lqt/qb-incubator-agent?style=flat-square&color=ff9ec7">';
  }
}

function buildClient() {
  const apiKey = keyInput.value.trim();
  if (!apiKey) return null;
  const c = new QBClient({ apiKey, model: modelSelect.value });
  attachPendingSession(c);      // 已存档的会话在这里接上
  return c;
}

function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 140) + "px";
}

function refreshKeyState() {
  const has = !!keyInput.value.trim();
  const el = $("keyState");
  el.textContent = has ? "key 已就绪" : "未配置 key";
  el.className = has ? "ok" : "bad";
  $("send").disabled = !has;
  $("q").placeholder = has ? "输入问题，Enter 发送" : "先填入 API key 再开始";
}

// ---------------- 结局卡片（Canvas 绘制，可下载 PNG / 复制文案） ----------------
let avatarImage = null;
function loadAvatar() {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { avatarImage = img; resolve(img); };
    img.onerror = () => { img.onerror = null; img.src = "./qb.svg"; };
    img.src = "./qb.png";
    setTimeout(() => resolve(avatarImage), 3000);
  });
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const chars = [...text];
  let line = "";
  let lines = 0;
  for (const ch of chars) {
    if (ch === "\n") {
      ctx.fillText(line, x, y);
      line = ""; y += lineHeight; lines += 1;
      if (maxLines && lines >= maxLines) return y;
      continue;
    }
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, y);
      line = ch; y += lineHeight; lines += 1;
      if (maxLines && lines >= maxLines) return y;
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, y); y += lineHeight; }
  return y;
}

async function drawEndingCard(info) {
  const canvas = $("cardCanvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const st = info.state || {};

  ctx.clearRect(0, 0, W, H);
  // 背景
  ctx.fillStyle = "#fdf7fa"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffe9f3"; ctx.fillRect(0, 0, W, 132);
  ctx.fillStyle = "#ff9ec7"; ctx.fillRect(0, 0, 10, H);

  if (!avatarImage) await loadAvatar();
  if (avatarImage) {
    ctx.save();
    ctx.beginPath(); ctx.arc(78, 66, 38, 0, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.clip();
    ctx.drawImage(avatarImage, 40, 28, 76, 76);
    ctx.restore();
    ctx.beginPath(); ctx.arc(78, 66, 38, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffd0e4"; ctx.lineWidth = 2; ctx.stroke();
  }

  ctx.fillStyle = "#7a3355";
  ctx.font = "600 20px 'Microsoft YaHei', sans-serif";
  ctx.fillText("孵化者 QB · 契约终端", 136, 50);
  ctx.font = "13px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = "#a37b90";
  ctx.fillText("一个只会劝你学土木的 Agent ｜ github.com/user-lqt/qb-incubator-agent", 136, 76);

  // 结局名
  ctx.fillStyle = "#b3356b";
  ctx.font = "700 44px 'Microsoft YaHei', sans-serif";
  ctx.fillText(info.title || "未知结局", 44, 208);
  ctx.fillStyle = "#a37b90";
  ctx.font = "16px 'Microsoft YaHei', sans-serif";
  ctx.fillText(info.tagline || "", 46, 240);

  // 四维数值
  const dims = [["契约", st.contract || 0, "#ff8bbd"], ["怀疑", st.suspicion || 0, "#a877e8"],
                ["绝望", st.despair || 0, "#8095c4"], ["抗拒", st.resistance || 0, "#d64f68"]];
  let bx = 46;
  ctx.font = "14px 'Microsoft YaHei', sans-serif";
  for (const [label, value, color] of dims) {
    ctx.fillStyle = "#7b6270";
    ctx.fillText(`${label} ${value}`, bx, 286);
    ctx.fillStyle = "#efe2ea";
    ctx.fillRect(bx, 296, 120, 8);
    ctx.fillStyle = color;
    ctx.fillRect(bx, 296, Math.min(120, value * 1.2), 8);
    bx += 150;
  }
  ctx.fillStyle = "#a37b90";
  ctx.font = "13px 'Microsoft YaHei', sans-serif";
  ctx.fillText(`第 ${st.turn || 0}/${st.limit || st.max_turns || "?"} 轮　｜　`
    + `推进度 ${Math.round((info.tension || 0) * 100)}%　｜　${info.date || ""}`, 46, 336);

  // 后日谈
  ctx.fillStyle = "#7a3355";
  ctx.font = "700 18px 'Microsoft YaHei', sans-serif";
  ctx.fillText("后日谈", 46, 372);
  ctx.fillStyle = "#4d3a44";
  ctx.font = "16px 'Microsoft YaHei', sans-serif";
  const body = String(info.epilogue || "").replace(/^【.*?】\n?/, "");
  const endY = wrapText(ctx, body, 46, 402, W - 92, 27, 12);
  // 分割线 + 页脚
  ctx.strokeStyle = "#f3e3ec"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(46, Math.max(endY + 6, 620)); ctx.lineTo(W - 46, Math.max(endY + 6, 620)); ctx.stroke();

  // 页脚
  ctx.fillStyle = "#c9b3bf";
  ctx.font = "12px 'Microsoft YaHei', sans-serif";
  ctx.fillText("「和我签订契约，成为土木少女吧。」", 46, H - 26);
  ctx.fillText("（玩梗作品，不构成任何职业建议）", W - 300, H - 26);
  return canvas;
}

let lastEndingInfo = null;

async function showEndingCard(info) {
  lastEndingInfo = info;
  await drawEndingCard(info);
  $("cardModal").classList.add("open");
}

const cardText = (info) => [
  `【${info.title}】${info.tagline}`,
  `契约 ${info.state.contract}｜怀疑 ${info.state.suspicion}｜绝望 ${info.state.despair}｜抗拒 ${info.state.resistance}`,
  `第 ${info.state.turn} 轮｜${info.date}`,
  "",
  info.epilogue,
  "",
  "—— 孵化者 QB · 契约终端 https://user-lqt.github.io/qb-incubator-agent/",
].join("\n");

async function ask(preset, intent) {
  const text = (preset !== undefined ? String(preset) : $("q").value).trim();
  if (!text) return;
  if (!client) {
    client = buildClient();
    if (!client) { add("sys", "请先在右上角填入自己的 DeepSeek API key（在 platform.deepseek.com 申请），点「保存 key」后即可开始。"); return; }
  }
  clearChoices();
  add("me", text);
  $("q").value = "";
  autoGrow($("q"));
  $("send").disabled = true;
  const waiting = add("sys", "僕在计算……");
  try {
    const r = await client.turn(text, intent || "");
    waiting.remove();
    add("qb", r.answer);
    renderBars(r.state);
    const src = { model: "语义判定", rescue: "语义判定·补救", keywords: "关键词兜底" }[r.state.score_source]
      || r.state.score_source || "";
    add("sys", describeDelta(prevState, r.state) + (src ? `　［判定：${src}］` : ""));
    prevState = { ...r.state };
    showEnding(r.ending_title, r.ending_tagline);
    if (!r.ending) showChoices(r.choices, r.choiceDirs || []);
    if (r.ending && r.epilogue) add("sys", r.epilogue);      // 后日谈
    if (r.ending) {
      await showEndingCard({
        title: r.ending_title, tagline: r.ending_tagline, epilogue: r.epilogue,
        state: r.state, tension: r.tension,
        date: new Date().toLocaleString("zh-CN", { hour12: false }),
      });
    }
    saveSession();
  } catch (e) {
    waiting.remove();
    add("sys", "出错了：" + e.message + "（检查 key、余额与网络；跨域失败请换用本地 http 服务器打开本页）");
  } finally {
    $("send").disabled = false;
    $("q").focus();
  }
}

$("send").onclick = ask;
// 结局卡片按钮
$("closeCard").onclick = () => $("cardModal").classList.remove("open");
$("cardModal").onclick = (e) => { if (e.target.id === "cardModal") $("cardModal").classList.remove("open"); };
$("dlCard").onclick = () => {
  const canvas = $("cardCanvas");
  canvas.toBlob((blob) => {
    if (!blob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `QB结局-${(lastEndingInfo && lastEndingInfo.title) || "结果"}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, "image/png");
};
$("copyCard").onclick = async () => {
  if (!lastEndingInfo) return;
  try {
    await navigator.clipboard.writeText(cardText(lastEndingInfo));
    add("sys", "结局文案已复制到剪贴板。");
  } catch {
    add("sys", "复制失败，可手动选中卡片文字。");
  }
};
$("reset").onclick = () => {
  clearSession();
  pendingSession = null;
  client = buildClient() || new QBClient({ apiKey: "dummy", model: modelSelect.value });
  client.reset();
  log.innerHTML = "";
  clearChoices();
  $("banner").style.display = "none";
  lastState = null;
  prevState = emptyState();
  renderBars(emptyState());
  add("sys", "记录已清空。新的一条时间线开始——或者，是第十三条。");
  add("qb", PROLOGUE);
  if (!keyInput.value.trim()) {
    add("sys", "先在右上角填入你自己的 DeepSeek API key（只存这台设备的浏览器），再开始对话。");
  }
};

$("save").onclick = () => {
  localStorage.setItem("qb_key", keyInput.value.trim());
  localStorage.setItem("qb_model", modelSelect.value);
  client = buildClient();
  refreshKeyState();
  add("sys", client
    ? "key 已保存在本机浏览器（只在请求模型时作为 authorization 使用，不上传到任何第三方服务器）。现在可以直接提问了。"
    : "key 是空的。去 platform.deepseek.com 申请一个 sk- 开头的 key，粘到右上角输入框。");
};

keyInput.value = localStorage.getItem("qb_key") || "";
modelSelect.value = localStorage.getItem("qb_model") || "deepseek-chat";
keyInput.addEventListener("input", refreshKeyState);
keyInput.addEventListener("change", () => {
  localStorage.setItem("qb_key", keyInput.value.trim());
  client = buildClient();
  refreshKeyState();
});
modelSelect.addEventListener("change", () => {
  localStorage.setItem("qb_model", modelSelect.value);
  client = buildClient();
});
client = buildClient();
refreshKeyState();
wireAvatar($("avatar"));
loadStars();                // 取一次星标数（有缓存，失败就静默降级）
// 有存档就恢复上次对话，没有才播放序章
const restored = restoreSession();
if (!restored) {
  renderBars(emptyState());
  add("qb", PROLOGUE);
  add("sys", keyInput.value.trim()
    ? `这一局上限 ${BASE_TURNS} 轮，只要君还在推进，僕就会继续等下去（最多 ${HARD_CAP} 轮）。要不要签，由君决定。`
    : "先在右上角填入你自己的 DeepSeek API key（只存这台设备的浏览器，不会被上传），再开始对话。");
}
// 版本标签：一眼看出当前跑的是哪一版（排查缓存混搭用）
(function showVersion() {
  const el = $("verLabel");
  if (el) {
    el.textContent = `当前页面版本 ${V.replace("?v=", "v")}｜对话自动保存在本机，刷新可恢复`
      + "（行为异常请 Ctrl+Shift+R 强刷）";
  }
})();

// 开场：有存档则恢复，否则由上面的分支播放序章
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
$("q").addEventListener("input", () => autoGrow($("q")));
</script>
