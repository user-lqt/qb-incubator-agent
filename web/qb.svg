<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="孵化者 头像（本项目原创绘制）">
  <title>孵化者 · 原创矢量头像</title>
  <g stroke="#e6d5de" stroke-width="1.4" fill="#ffffff">
    <!-- 双耳 -->
    <ellipse cx="22.5" cy="15.5" rx="5.2" ry="12.5" transform="rotate(-16 22.5 15.5)"/>
    <ellipse cx="41.5" cy="15.5" rx="5.2" ry="12.5" transform="rotate(16 41.5 15.5)"/>
  </g>
  <!-- 耳内 -->
  <g fill="#ffb6d5">
    <ellipse cx="22.9" cy="15.8" rx="2.6" ry="8.4" transform="rotate(-16 22.9 15.8)"/>
    <ellipse cx="41.1" cy="15.8" rx="2.6" ry="8.4" transform="rotate(16 41.1 15.8)"/>
  </g>
  <!-- 耳环（金） -->
  <g fill="none" stroke="#e8c15a" stroke-width="1.5">
    <ellipse cx="22.5" cy="19.5" rx="5.4" ry="3.4" transform="rotate(-16 22.5 19.5)"/>
    <ellipse cx="41.5" cy="19.5" rx="5.4" ry="3.4" transform="rotate(16 41.5 19.5)"/>
  </g>
  <!-- 身体 -->
  <ellipse cx="32" cy="40.5" rx="15.5" ry="14" fill="#ffffff" stroke="#e6d5de" stroke-width="1.4"/>
  <!-- 尾巴 -->
  <ellipse cx="50" cy="50" rx="6.5" ry="3.6" transform="rotate(24 50 50)"
           fill="#ffffff" stroke="#e6d5de" stroke-width="1.3"/>
  <!-- 红瞳 -->
  <g fill="#d63a52">
    <ellipse cx="26" cy="38" rx="3.1" ry="4.1"/>
    <ellipse cx="38" cy="38" rx="3.1" ry="4.1"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <circle cx="25" cy="36.4" r="0.9"/>
    <circle cx="37" cy="36.4" r="0.9"/>
  </g>
  <!-- 嘴 -->
  <path d="M29.6 46.4 q2.4 2 4.8 0" fill="none" stroke="#c9b3bf" stroke-width="1.3"
        stroke-linecap="round"/>
</svg>
